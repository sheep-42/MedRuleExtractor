services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./logs:/app/logs
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uvicorn", "extract.web_app:app", "--host", "0.0.0.0", "--port", "5000"]
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./results:/app/results
      - ./instructions_MD:/app/instructions_MD
      - ./logs:/app/logs
  frontend:
    build: ./medrule-assistant
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
